name: Release

# Manual only. Pushing a tag does NOT cut a release: tags get pushed for all
# sorts of reasons, and publishing is a decision, not a side effect of
# tagging. Tag the commit, then dispatch this workflow with that tag selected
# as the ref.
#
#   checks -> ci -> packages -> release
#
# Nothing public happens until every earlier stage is green. In particular the
# distro packages are built FIRST, in joske/yserver-packaging, and this
# workflow waits for that run to succeed before creating the release. The
# packaging build works from a `git archive` of the tag and does not need the
# release to exist, so this ordering costs nothing and means a broken package
# can never leave a published release behind.
#
# (The mergers repo creates the release first and uploads platform artifacts
# afterwards. That is fine when the uploads are the last step, but here a
# failed distro build would strand a public release, so the order is
# deliberately inverted.)
#
# The release ships the distro packages and nothing else. It used to upload its
# own git-archive tarball plus SHA256SUMS/SHA512SUMS, on the grounds that
# GitHub's auto-generated /archive/ tarballs are produced on demand and are not
# guaranteed byte-stable (they changed once in 2023, invalidating pinned
# checksums across the AUR). That was dropped in v1.4.1: it duplicated a
# tarball GitHub already publishes as "Source code (tar.gz)" — same tree,
# different bytes — so the release page offered two source downloads, only one
# of which matched the published checksums.
#
# Downstream checksummed recipes now pin the auto-generated archive. The final
# step reports its sha256/sha512 in the job summary so nobody has to recompute
# them after a release.
#
# The release is created as a DRAFT and published only after its packages are
# verified, so a mid-upload failure never leaves a public, half-populated
# release.
#
# Note on interpolation: values reach the shell through `env:` only, never
# through direct ${{ }} substitution inside `run:`.

on:
  workflow_dispatch:

permissions:
  contents: read

# Two concurrent dispatches must not race to publish the same tag.
concurrency:
  group: release
  cancel-in-progress: false

env:
  PACKAGING_REPO: joske/yserver-packaging

jobs:
  # Cheap, side-effect-free gates. Deliberately does NOT run install-smoke:
  # ci.yml already does, and duplicating it here would mean two full release
  # builds of the workspace, serially, for identical coverage.
  checks:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.get_tag.outputs.tag }}
      version: ${{ steps.get_tag.outputs.version }}
      prev_tag: ${{ steps.get_tag.outputs.prev_tag }}
      sha: ${{ steps.get_tag.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Identify and bind the tag
        id: get_tag
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -eu
          # Require the dispatch itself to have selected a tag, rather than
          # inferring one from HEAD. `git tag --points-at HEAD` would happily
          # pick a tag that merely happens to point at a branch tip, and would
          # silently choose between several.
          if [ "$REF_TYPE" != tag ]; then
            echo "::error::dispatch this workflow with a TAG selected as the ref (got $REF_TYPE '$REF_NAME')"
            exit 1
          fi
          TAG="$REF_NAME"
          # A real version grammar, not `v[0-9]*` — that would accept "v1 bad"
          # and "v1/anything", which then break API paths and asset filenames.
          printf '%s\n' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$' \
            || { echo "::error::not a vMAJOR.MINOR.PATCH release tag: $TAG"; exit 1; }

          # Bind everything downstream to one commit. `^{}` dereferences an
          # annotated tag to its commit; lightweight tags are unaffected. If
          # the tag is moved mid-run, later jobs re-checkout and would silently
          # archive different content without this.
          TAG_SHA=$(git rev-parse "$TAG^{}")
          if [ "$TAG_SHA" != "$EXPECTED_SHA" ]; then
            echo "::error::$TAG resolves to $TAG_SHA but the run is on $EXPECTED_SHA"
            exit 1
          fi
          echo "Releasing $TAG at $TAG_SHA"

          # Bound the generated release notes. Without a previous release,
          # --generate-notes has no boundary and would cover the entire
          # history; the preceding v* tag is the right starting point.
          PREV=$(git describe --tags --abbrev=0 --match 'v*' "$TAG^" 2>/dev/null || true)
          [ -z "$PREV" ] || echo "Previous tag: $PREV"

          printf 'tag=%s\n' "$TAG" >> "$GITHUB_OUTPUT"
          printf 'version=%s\n' "${TAG#v}" >> "$GITHUB_OUTPUT"
          printf 'prev_tag=%s\n' "$PREV" >> "$GITHUB_OUTPUT"
          printf 'sha=%s\n' "$TAG_SHA" >> "$GITHUB_OUTPUT"

      - name: Check tag matches Cargo.toml version
        env:
          TAG: ${{ steps.get_tag.outputs.tag }}
        run: |
          set -eu
          VERSION="${TAG#v}"
          CARGO_VERSION=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          if [ "$VERSION" != "$CARGO_VERSION" ]; then
            echo "::error::tag version ($VERSION) does not match Cargo.toml version ($CARGO_VERSION)"
            exit 1
          fi
          echo "Tag matches Cargo.toml version: $VERSION"

      - name: Check the tag exists on the remote
        env:
          TAG: ${{ steps.get_tag.outputs.tag }}
        run: |
          set -eu
          # A tag that only exists locally would produce a release pointing at
          # a ref nobody else can fetch.
          found=$(git ls-remote --tags origin "refs/tags/$TAG" || true)
          [ -n "$found" ] || { echo "::error::$TAG is not pushed to origin"; exit 1; }
          echo "$TAG exists on origin."

      - name: Check no published release exists for the tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.get_tag.outputs.tag }}
        run: |
          set -eu
          # Ask the API directly so a genuine 404 can be told apart from an
          # auth or transport failure. `gh release view` exits non-zero for
          # both, and treating "API is broken" as "no release exists" would
          # march straight on to publishing.
          code=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/$TAG" \
                   --silent -i 2>/dev/null | awk 'NR==1{print $2}' || true)
          case "$code" in
            404)
              echo "No existing release for $TAG, proceeding."
              exit 0 ;;
            200) ;;
            *)
              echo "::error::could not determine release state for $TAG (HTTP '${code:-no response}')"
              exit 1 ;;
          esac
          state=$(gh release view "$TAG" --json isDraft --jq .isDraft)
          if [ "$state" = "true" ]; then
            # A leftover draft is this workflow's own debris from a failed run,
            # not a published artifact — it is safe to replace, and refusing
            # here would make a retry impossible without manual cleanup.
            echo "::notice::a DRAFT release for $TAG exists; it will be replaced"
            exit 0
          fi
          echo "::error::a published release for $TAG already exists. Delete it first to re-release."
          exit 1

      - name: Check the version is representable on Arch
        env:
          V: ${{ steps.get_tag.outputs.version }}
        run: |
          set -eu
          # An Arch pkgver may not contain a hyphen, but the tag grammar above
          # allows prereleases like v1.5.0-rc.1. The aur job refuses those too,
          # but it runs AFTER publication — catch it here instead.
          case "$V" in
            *-*)
              echo "::error::Arch pkgver cannot contain '-' ($V). Decide a mapping (e.g. 1.5.0rc.1) before releasing a prerelease."
              exit 1 ;;
          esac
          echo "version $V is a valid Arch pkgver."

      - name: Preflight the AUR credential
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
        run: |
          set -eu
          # The aur job runs AFTER publication and hard-fails without this
          # secret. Catch its absence here, while nothing is public yet.
          [ -n "${AUR_SSH_KEY:-}" ] \
            || { echo "::error::AUR_SSH_KEY is not set; the AUR bump would fail after publishing"; exit 1; }
          echo "AUR_SSH_KEY is present."

  ci:
    needs: checks
    uses: ./.github/workflows/ci.yml

  # Build the distro packages BEFORE anything is published, and fail the
  # release if they do not build. The packaging workflow takes the upstream ref
  # as an input and generates its own tarball, so it does not need the release.
  packages:
    needs: [checks, ci]
    runs-on: ubuntu-latest
    # GITHUB_TOKEN is unused here; all cross-repo work uses the fine-grained PAT.
    permissions: {}
    outputs:
      run_id: ${{ steps.build.outputs.run_id }}
    steps:
      - name: Trigger the packaging build and wait for it
        id: build
        env:
          GH_TOKEN: ${{ secrets.PACKAGING_DISPATCH_TOKEN }}
          TAG: ${{ needs.checks.outputs.tag }}
          REPO: ${{ env.PACKAGING_REPO }}
        run: |
          set -eu
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::PACKAGING_DISPATCH_TOKEN is not set — cannot verify the packages build."
            echo "Create a fine-grained PAT limited to $REPO with \"Actions\" repository permissions (write)."
            exit 1
          fi

          # Remember the newest existing run WITH THIS TITLE, not the newest
          # run overall: if the tag was packaged manually before the release, an
          # older run for it already exists, differs from "newest overall", and
          # would be accepted immediately — attaching stale packages. Run ids
          # increase, so requiring a strictly greater id is sufficient.
          matching='[.[] | select(.displayTitle == "packages for '"$TAG"'")] | .[0].databaseId // 0'
          before=$(gh run list -R "$REPO" --workflow build.yml -L 50 \
                     --json databaseId,displayTitle --jq "$matching")
          echo "newest existing run for $TAG: $before"

          gh workflow run build.yml -R "$REPO" -f "ref=$TAG"
          echo "Triggered the packaging build for $TAG; waiting for it to appear."

          # Correlate on the run title, which the packaging workflow sets to
          # "packages for <ref>" via run-name. Taking the newest run outright
          # would silently attach packages from someone else's concurrent
          # manual dispatch — and that run may have built a different ref.
          # 90 x 10s = 15 minutes for the run to merely APPEAR. Generous on
          # purpose: GitHub's dispatch-to-queued latency is highly variable, and
          # timing out here would fail a release for no reason other than
          # Actions being slow. The run is manual, so waiting costs nothing.
          id=""
          i=0
          while [ "$i" -lt 90 ]; do
            i=$((i + 1))
            sleep 10
            latest=$(gh run list -R "$REPO" --workflow build.yml -L 50 \
                       --json databaseId,displayTitle --jq "$matching")
            if [ "$latest" -gt "$before" ]; then
              id="$latest"
              break
            fi
          done
          [ -n "$id" ] || { echo "::error::no packaging run titled \"packages for $TAG\" appeared"; exit 1; }
          echo "Packaging run: https://github.com/$REPO/actions/runs/$id"
          # The release job downloads this run's artifacts and attaches them.
          printf 'run_id=%s\n' "$id" >> "$GITHUB_OUTPUT"

          # Three container builds, each compiling the whole workspace.
          status=""
          i=0
          while [ "$i" -lt 240 ]; do
            i=$((i + 1))
            status=$(gh run view "$id" -R "$REPO" --json status --jq .status)
            [ "$status" = "completed" ] && break
            sleep 15
          done
          if [ "$status" != "completed" ]; then
            echo "::error::timed out waiting for the packaging run to finish"
            exit 1
          fi

          conclusion=$(gh run view "$id" -R "$REPO" --json conclusion --jq .conclusion)
          if [ "$conclusion" != "success" ]; then
            echo "::error::the packaging build finished with '$conclusion' — not releasing"
            exit 1
          fi
          echo "Packages built successfully."

  release:
    needs: [checks, ci, packages]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Check out the exact commit `checks` bound, not the ref again: if the tag
      # were moved mid-run, re-resolving it here would archive different content
      # than everything upstream verified.
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.checks.outputs.sha }}
          fetch-depth: 0

      - name: Create the release as a draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.checks.outputs.tag }}
          V: ${{ needs.checks.outputs.version }}
          PREV: ${{ needs.checks.outputs.prev_tag }}
        run: |
          set -eu
          # Replace our own leftover draft from an earlier failed run, so a
          # retry does not need manual cleanup. Only drafts reach this point:
          # `checks` fails on a published release.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Deleting the existing draft for $TAG."
            gh release delete "$TAG" --yes
          fi

          # --verify-tag: refuse if the tag is absent from the remote.
          # --notes-start-tag: bound the generated notes; without it the first
          # release would generate notes across the whole history.
          set -- --draft --verify-tag --title "yserver $V" --generate-notes
          [ -z "$PREV" ] || set -- "$@" --notes-start-tag "$PREV"
          # No files here: GitHub's own auto-generated source archives are the
          # source download, and the distro packages are attached below.
          gh release create "$TAG" "$@"

      - name: Attach the distro packages built for this tag
        # Built by the `packages` job before anything was published, from the
        # same tag — but NOT from these exact tarball bytes: the packaging run
        # makes its own `git archive` on its own runner. Same source tree, not
        # the same bytes. Attaching to the DRAFT means the release is never
        # public without its packages.
        #
        # The packaging token is reused for the download: "Actions: write"
        # includes read, so no extra secret is needed.
        env:
          GH_TOKEN: ${{ secrets.PACKAGING_DISPATCH_TOKEN }}
          REPO: ${{ env.PACKAGING_REPO }}
          RUN_ID: ${{ needs.packages.outputs.run_id }}
        run: |
          set -eu
          [ -n "$RUN_ID" ] || { echo "::error::no packaging run id was recorded"; exit 1; }
          mkdir -p dist
          gh run download "$RUN_ID" -R "$REPO" -D dist

          # Collect by extension rather than by artifact layout: upload-artifact
          # preserves the least-common-ancestor directory, so the RPMs arrive
          # nested under RPMS/<arch>/ and SRPMS/ while the .deb and .apk are
          # flat. Matching *.tar.gz is excluded deliberately: the packaging run
          # ships its own git-archive tarball, and the release has no business
          # carrying a second source download beside GitHub's own "Source code
          # (tar.gz)". Until v1.4.0 this workflow did upload such a tarball, and
          # matching *.tar.gz here would have clobbered the very file whose
          # checksums it published.
          #
          # Debug and source packages are excluded: debuginfo/debugsource/dbgsym
          # plus the .src.rpm are ~40 MB of the ~46 MB, against ~5 MB of
          # actually installable packages.
          # NUL-delimited: plain `xargs` would split on whitespace and mangle
          # quotes. Package names are tame today, but this costs nothing.
          find dist -type f \
               \( -name '*.rpm' -o -name '*.deb' -o -name '*.apk' \) \
               ! -name '*debuginfo*' ! -name '*debugsource*' \
               ! -name '*dbgsym*'   ! -name '*.src.rpm' \
               -print0 > pkglist
          # Basenames become the release asset names, and that namespace is
          # flat, so record them for the post-upload inventory check.
          find dist -type f \
               \( -name '*.rpm' -o -name '*.deb' -o -name '*.apk' \) \
               ! -name '*debuginfo*' ! -name '*debugsource*' \
               ! -name '*dbgsym*'   ! -name '*.src.rpm' \
               -printf '%f\n' | LC_ALL=C sort > pkgnames
          count=$(wc -l < pkgnames)
          echo "found $count package file(s):"
          cat pkgnames
          [ "$count" -gt 0 ] || { echo "::error::no packages found in the packaging artifacts"; exit 1; }
          # Two artifacts contributing the same basename would silently
          # overwrite each other on the release.
          dupes=$(uniq -d < pkgnames)
          [ -z "$dupes" ] || { echo "::error::duplicate package basenames: $dupes"; exit 1; }

      - name: Upload the packages to the draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.checks.outputs.tag }}
        run: |
          set -eu
          # --clobber so retrying just this step against the same draft replaces
          # rather than fails. Reads the list rather than globbing: the Fedora
          # RPMs arrive nested under RPMS/<arch>/.
          xargs -0 -a pkglist -- gh release upload "$TAG" --clobber

      - name: Verify the draft's assets before publishing
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.checks.outputs.tag }}
          V: ${{ needs.checks.outputs.version }}
          SHA: ${{ needs.checks.outputs.sha }}
        run: |
          set -eu
          # Assert every expected asset is actually attached. gh uploads assets
          # after creating the release, so a partial upload is possible — and
          # it must never be published.
          names=$(gh release view "$TAG" --json assets --jq '.assets[].name')
          printf 'attached assets:\n%s\n' "$names"

          # Exact inventory, not "at least one per extension": that weaker check
          # passes when packages are missing, or when they came from an
          # unrelated packaging run.
          # LC_ALL=C on both sides: collation of '-' vs '_' is locale-dependent,
          # and the two lists are sorted in different steps.
          attached=$(printf '%s\n' "$names" | grep -E '\.(rpm|deb|apk)$' | LC_ALL=C sort || true)
          if [ "$attached" != "$(cat pkgnames)" ]; then
            echo "::error::attached packages do not match what was downloaded"
            echo "expected:"; cat pkgnames
            echo "attached:"; printf '%s\n' "$attached"
            exit 1
          fi
          echo "package inventory matches."

          # The tag must still point where `checks` bound it. If it moved during
          # the run, the assets and the tag would disagree once published.
          git fetch --tags --force origin >/dev/null 2>&1 || true
          now=$(git rev-parse "refs/tags/$TAG^{}" 2>/dev/null || echo unknown)
          [ "$now" = "$SHA" ] \
            || { echo "::error::$TAG now resolves to $now, expected $SHA"; exit 1; }

      - name: Report the source-archive checksums for downstream recipes
        env:
          TAG: ${{ needs.checks.outputs.tag }}
          V: ${{ needs.checks.outputs.version }}
          URL_BASE: https://github.com/${{ github.repository }}
        run: |
          set -eu
          # Checksummed recipes (alpine/APKBUILD, the AUR PKGBUILD) pin
          # GitHub's auto-generated tag archive. Fetch it and report the hashes
          # so nobody has to recompute them by hand after a release.
          url="$URL_BASE/archive/refs/tags/$TAG.tar.gz"
          curl -sSLf -o src.tar.gz "$url"
          sha256=$(sha256sum src.tar.gz | cut -d' ' -f1)
          sha512=$(sha512sum src.tar.gz | cut -d' ' -f1)
          {
            echo "## $TAG published"
            echo
            echo "Source archive: \`$url\`"
            echo
            echo '```'
            echo "sha256  $sha256"
            echo "sha512  $sha512"
            echo '```'
            echo
            echo "For \`alpine/APKBUILD\` (or run \`abuild checksum\`):"
            echo
            echo '```sh'
            echo "sha512sums=\""
            echo "$sha512  yserver-$V.tar.gz"
            echo "\""
            echo '```'
            echo
            echo "For the AUR PKGBUILD (or run \`updpkgsums\`):"
            echo
            echo '```sh'
            echo "sha256sums=('$sha256')"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.checks.outputs.tag }}
        run: |
          set -eu
          gh release edit "$TAG" --draft=false
          echo "Published $TAG."
  # Bump the AUR package. Modelled on the mergers repo's `aur:` job, but with
  # its .SRCINFO step reworked — see the isolation note below.
  #
  # Needs an AUR_SSH_KEY secret: the private half of an SSH key registered on
  # the maintainer's AUR account. A MISSING key is a hard failure, not a skip:
  # this job runs after publication, so skipping would leave a published
  # release with a silently stale AUR package and a green tick. `checks`
  # preflights the secret so that failure happens before anything is public.
  #
  # Recovery contract: the GitHub release is authoritative. If this job fails,
  # the release stays published and this job is re-run after fixing the cause.
  # Cross-system publication cannot be atomic, and it is not worth pretending.
  aur:
    needs: [checks, release]
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    env:
      # Arch publishes the AUR host keys; corroborated by an independent
      # ssh-keyscan. Pinned rather than trust-on-first-use, because a MITM here
      # could serve a hostile PKGBUILD and PKGBUILDs are executable shell.
      AUR_HOST_FP: SHA256:RFzBCUItH9LZS0cKB5UE6ceAYhBD5C8GeOBip8Z11+4
      AUR_REPO: ssh://aur@aur.archlinux.org/yserver.git
    steps:
      - name: Install dependencies
        run: pacman -Sy --noconfirm git openssh

      - name: Check the version is representable on Arch
        env:
          V: ${{ needs.checks.outputs.version }}
        run: |
          set -eu
          # Arch pkgver may not contain a hyphen, but the release tag grammar
          # allows prereleases like v1.5.0-rc.1. Rather than invent a mapping
          # policy silently, refuse and make it a decision.
          case "$V" in
            *-*)
              echo "::error::pkgver cannot contain '-' ($V). Decide a mapping (e.g. 1.5.0rc.1) before releasing a prerelease to the AUR."
              exit 1 ;;
          esac
          echo "version $V is a valid Arch pkgver."

      - name: Set up and verify the AUR SSH key
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
        run: |
          set -eu
          if [ -z "${AUR_SSH_KEY:-}" ]; then
            echo "::error::AUR_SSH_KEY is not set — the AUR package will not be updated."
            exit 1
          fi
          mkdir -p -m 700 /root/.ssh
          printf '%s\n' "$AUR_SSH_KEY" > /root/.ssh/aur
          chmod 600 /root/.ssh/aur
          # Fail here rather than at push time on a truncated or passphrased key.
          ssh-keygen -y -P '' -f /root/.ssh/aur > /dev/null \
            || { echo "::error::AUR_SSH_KEY is not a usable unencrypted private key"; exit 1; }

          # Pin the host key: keyscan, then require the fingerprint to match.
          ssh-keyscan -t ed25519 aur.archlinux.org > /root/.ssh/known_hosts 2>/dev/null
          # sort -u so several identical scanned keys do not read as a mismatch.
          got=$(ssh-keygen -lf /root/.ssh/known_hosts | awk '{print $2}' | LC_ALL=C sort -u)
          if [ "$got" != "$AUR_HOST_FP" ]; then
            echo "::error::AUR host key fingerprint mismatch"
            echo "  expected: $AUR_HOST_FP"
            echo "  got:      $got"
            exit 1
          fi
          echo "AUR host key fingerprint matches."

      - name: Clone the AUR repo
        run: |
          set -eu
          GIT_SSH_COMMAND="ssh -i /root/.ssh/aur -o IdentitiesOnly=yes -o BatchMode=yes" \
            git clone "$AUR_REPO" aur-repo

      - name: Update PKGBUILD
        env:
          TAG: ${{ needs.checks.outputs.tag }}
          V: ${{ needs.checks.outputs.version }}
        run: |
          set -eu
          # The AUR PKGBUILD pins GitHub's auto-generated tag archive.
          sha=$(curl -sSLf "https://github.com/joske/yserver/archive/refs/tags/$TAG.tar.gz" \
                | sha256sum | cut -d' ' -f1)
          case "$sha" in
            [0-9a-f]*) [ ${#sha} -eq 64 ] || { echo "::error::bad sha256: $sha"; exit 1; } ;;
            *) echo "::error::could not hash the source archive"; exit 1 ;;
          esac

          cd aur-repo
          sed -i "s/^pkgver=.*/pkgver=$V/" PKGBUILD
          sed -i "s/^pkgrel=.*/pkgrel=1/" PKGBUILD
          sed -i "s/^sha256sums=.*/sha256sums=('$sha')/" PKGBUILD

          # sed exits 0 when it replaces nothing, so assert the end state
          # instead of trusting it.
          for want in "pkgver=$V" "pkgrel=1" "sha256sums=('$sha')"; do
            grep -qxF "$want" PKGBUILD \
              || { echo "::error::PKGBUILD does not contain the expected line: $want"; exit 1; }
          done
          bash -n PKGBUILD || { echo "::error::edited PKGBUILD is not valid bash"; exit 1; }
          grep -E '^(pkgver|pkgrel|sha256sums)=' PKGBUILD

      - name: Regenerate .SRCINFO
        run: |
          set -eu
          # Deliberately NOT `chown -R builder aur-repo`: makepkg SOURCES the
          # PKGBUILD, which is executable shell. Handing it the clone including
          # .git would let a hostile PKGBUILD plant a .git hook that later runs
          # as root during commit/push, with the AUR key readable. So generate
          # in a throwaway directory holding nothing but a copy of PKGBUILD,
          # and keep aur-repo and its .git root-owned throughout.
          useradd -m builder
          install -d -o builder -g builder /tmp/srcinfo
          install -o builder -g builder -m 644 aur-repo/PKGBUILD /tmp/srcinfo/PKGBUILD
          su builder -c 'cd /tmp/srcinfo && makepkg --printsrcinfo > .SRCINFO'
          # Copy back as root; the AUR rejects a push whose .SRCINFO disagrees
          # with the PKGBUILD, so this cannot be skipped.
          install -m 644 /tmp/srcinfo/.SRCINFO aur-repo/.SRCINFO
          grep -E '^\s*(pkgver|pkgrel|sha256sums)' aur-repo/.SRCINFO

      - name: Commit and push
        env:
          TAG: ${{ needs.checks.outputs.tag }}
        run: |
          set -eu
          cd aur-repo
          git config user.name  'Jos Dehaes'
          git config user.email 'jos.dehaes@gmail.com'
          git add PKGBUILD .SRCINFO
          if git diff-index --quiet HEAD; then
            echo "AUR package already at $TAG — nothing to push."
            exit 0
          fi
          git commit -m "Update to $TAG"
          # A concurrent AUR update yields a non-fast-forward failure, which is
          # the right outcome: no force push, no destructive retry.
          GIT_SSH_COMMAND="ssh -i /root/.ssh/aur -o IdentitiesOnly=yes -o BatchMode=yes" \
            git push
          echo "pushed $TAG to the AUR."

      - name: Remove the SSH key
        if: always()
        run: rm -f /root/.ssh/aur
